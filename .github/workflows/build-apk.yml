name: Build CloudTV Android TV APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Release & Debug APK with Gradle 8.4
        run: |
          set -e
          if [ -f "android-tv-app/settings.gradle.kts" ]; then
            cd android-tv-app
          fi
          echo "Using pre-installed ANDROID_HOME=$ANDROID_HOME"
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi
          curl -sSL https://services.gradle.org/distributions/gradle-8.4-bin.zip -o /tmp/gradle-8.4.zip
          unzip -q -o /tmp/gradle-8.4.zip -d /tmp
          /tmp/gradle-8.4/bin/gradle assembleRelease assembleDebug --no-daemon --stacktrace
          mkdir -p "$GITHUB_WORKSPACE/dist-apk"
          cp app/build/outputs/apk/release/*.apk "$GITHUB_WORKSPACE/dist-apk/CloudTV-IPv4-TVBox-Release.apk"
          cp app/build/outputs/apk/debug/*.apk "$GITHUB_WORKSPACE/dist-apk/CloudTV-IPv4-TVBox-Debug.apk"
          ls -lh "$GITHUB_WORKSPACE/dist-apk/"

      - name: Upload TV Box APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CloudTV-IPv4-AndroidTV-APK
          path: dist-apk/*.apk
